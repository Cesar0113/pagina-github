<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceder | Licorera Punto Frío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fraunces:ital@1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body{height:100%;}
  body{
    margin:0;position:relative;overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:40px 16px;
    background:var(--ice-950);
  }
  .login-bg-photo{
    position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:60% 30%;opacity:.4;z-index:0;
  }
  .login-bg-overlay{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(circle at 80% 15%, rgba(94,200,224,.22), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(217,138,51,.14), transparent 40%),
      linear-gradient(160deg, rgba(8,19,31,.85), rgba(11,30,51,.92) 60%, rgba(8,19,31,.95));
  }
  .login-ice{position:fixed;z-index:0;pointer-events:none;opacity:.5;}

  .login-wrap{position:relative;z-index:1;max-width:440px;width:100%;}
  .login-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
  .login-brand img{height:36px;}
  .breadcrumb{font-size:13px;color:rgba(245,249,252,.6);text-align:center;margin-bottom:6px;}
  .breadcrumb a{color:var(--cyan-soft);}

  .login-card{
    background:rgba(255,255,255,.96);border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.6);
    padding:36px 32px;border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(6px);
    position:relative;overflow:hidden;
  }
  .login-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--cyan), var(--amber));
  }
  .login-card h3{font-family:var(--font-label);font-style:italic;font-size:25px;color:var(--ice-900);margin-bottom:20px;text-align:center;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:14.5px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,138,51,.15);}
  .remember-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 20px;font-size:13.5px;flex-wrap:wrap;gap:8px;}
  .remember-row label{display:flex;align-items:center;gap:8px;color:#576573;}
  .remember-row a{color:var(--amber-dark);font-weight:600;}
  .login-error{
    display:none;background:#FDEBEC;color:#B3261E;border:1px solid #F5C2C4;
    padding:10px 14px;border-radius:8px;font-size:13.5px;margin-bottom:16px;
  }
  .login-error.active{display:block;}
  .back-home{display:block;text-align:center;margin-top:18px;font-size:13.5px;color:rgba(245,249,252,.75);}
  .back-home:hover{color:#fff;}
  .hint{font-size:12.5px;color:#8aa0b0;margin-top:14px;text-align:center;}
</style>
</head>
<body>

<img class="login-bg-photo" src="assets/imgs/r4.jpg" alt="" aria-hidden="true">
<div class="login-bg-overlay" aria-hidden="true"></div>
<svg class="login-ice" style="top:8%;left:6%;width:60px;" viewBox="0 0 60 60"><rect x="4" y="4" width="52" height="52" rx="8" fill="none" stroke="#BEEBFA" stroke-width="2"/><line x1="4" y1="24" x2="56" y2="20" stroke="#BEEBFA" stroke-width="1.5"/></svg>
<svg class="login-ice" style="bottom:10%;right:8%;width:44px;" viewBox="0 0 60 60"><rect x="4" y="4" width="52" height="52" rx="8" fill="none" stroke="#5EC8E0" stroke-width="2"/></svg>
<svg class="login-ice" style="top:60%;left:12%;width:26px;" viewBox="0 0 60 60"><rect x="4" y="4" width="52" height="52" rx="8" fill="none" stroke="#BEEBFA" stroke-width="2"/></svg>

<div class="login-wrap">
  <div class="login-brand">
    <img src="assets/icons/logo.svg" alt="Licorera Punto Frío">
  </div>
  <p class="breadcrumb"><a href="index.html">Inicio</a> / Mi cuenta</p>

  <div class="login-card">
    <h3>Acceder</h3>
    <div class="login-error" id="loginError">Usuario o contraseña incorrectos.</div>
    <form id="loginForm">
      <div class="field">
        <label for="user">Nombre de usuario</label>
        <input type="text" id="user" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" autocomplete="current-password" required>
      </div>
      <div class="remember-row">
        <label><input type="checkbox" id="remember"> Recuérdame</label>
        <a href="javascript:void(0)" onclick="alert('Contacta al dueño del negocio para restablecer la contraseña.')">¿Olvidaste la contraseña?</a>
      </div>
      <button type="submit" class="btn btn-amber" style="width:100%;justify-content:center;">Acceder</button>
    </form>
    <p class="hint">Acceso exclusivo para el administrador de la tienda.</p>
  </div>
  <a class="back-home" href="index.html">&larr; Volver a la tienda</a>
</div>

<script>
  var form = document.getElementById("loginForm");
  var errorBox = document.getElementById("loginError");

  // Si ya venía marcado "recuérdame" antes, precarga el usuario
  var remembered = localStorage.getItem("pf_admin_user");
  if (remembered) document.getElementById("user").value = remembered;

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var user = document.getElementById("user").value.trim();
    var pass = document.getElementById("pass").value.trim();

    if (user === "abmin" && pass === "abmin") {
      sessionStorage.setItem("pf_admin_logged_in", "true");
      if (document.getElementById("remember").checked) {
        localStorage.setItem("pf_admin_user", user);
      } else {
        localStorage.removeItem("pf_admin_user");
      }
      window.location.href = "admin.html";
    } else {
      errorBox.classList.add("active");
    }
  });
</script>
</body>
</html>
